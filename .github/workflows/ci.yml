name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - run: zig fmt --check .
      - run: zig build test --summary all
      # Zig cross-compiles out of the box, so one runner covers every target.
      - name: Cross-compile
        run: |
          for target in x86_64-linux-musl aarch64-linux-musl arm-linux-musleabihf x86_64-macos aarch64-macos x86_64-windows; do
            zig build -Dtarget=$target -Doptimize=ReleaseSmall -p dist/$target --summary all
          done
      - uses: actions/upload-artifact@v7
        with:
          name: escpos
          path: dist/*/bin/*
          if-no-files-found: error
