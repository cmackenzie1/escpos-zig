name: Setup Zig
description: Download Zig from ziglang.org, verify its SHA-256, and add it to PATH.

inputs:
  version:
    description: Zig version to install
    default: 0.17.0

runs:
  using: composite
  steps:
    - shell: bash
      env:
        ZIG_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [ "$ZIG_VERSION" != "0.17.0" ]; then
          echo "::error::no checksums recorded for Zig $ZIG_VERSION; add them to this action"
          exit 1
        fi

        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)   target=x86_64-linux;  sha256=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 ;;
          Linux-ARM64) target=aarch64-linux; sha256=9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8 ;;
          macOS-ARM64) target=aarch64-macos; sha256=b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a ;;
          *) echo "::error::unsupported runner $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac

        name="zig-$target-$ZIG_VERSION"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/$name.tar.xz"
        echo "$sha256  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -

        mkdir -p "$RUNNER_TEMP/zig"
        tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
        echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
